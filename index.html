<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cerdik Ceria</title>
<meta name="theme-color" content="#FFF8EE">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8EE; --card:#FFFFFF; --ink:#3E3A5C; --soft:#8A86A8; --line:#EFE7DA;
  --bm:#FFC8B4; --bm-d:#E0795A;
  --bi:#BFE3FF; --bi-d:#4A90C8;
  --math:#FFE79E; --math-d:#C99A13;
  --sains:#C5EFCF; --sains-d:#3E9E5B;
  --sejarah:#E3D3FF; --sejarah-d:#8A63D2;
  --ok:#5CC08A; --ok-bg:#E3F7EA; --no:#EF7B7B; --no-bg:#FDE6E6;
  --accent:#FF9DBB;
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px}
body{min-height:100vh;background:
  radial-gradient(circle at 10% 0%,#FFE3EC 0,transparent 35%),
  radial-gradient(circle at 100% 30%,#E0F1FF 0,transparent 35%),
  radial-gradient(circle at 0% 100%,#E6F8EA 0,transparent 35%),var(--bg);background-attachment:fixed}
h1,h2,h3,.baloo{font-family:"Baloo 2",Nunito,sans-serif;margin:0;line-height:1.15}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
.screen{display:none;animation:pop .35s ease}
.screen.on{display:block}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 18px}
.logo{display:flex;align-items:center;gap:10px}
.logo b{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-size:26px;font-weight:800;letter-spacing:.2px}
.logo b span{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:18px;font-weight:800;font-size:18px;font-family:"Baloo 2",Nunito,system-ui,sans-serif;background:var(--ink);color:#fff;box-shadow:0 5px 0 #24213b;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #24213b}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.pink{background:var(--accent);box-shadow:0 5px 0 #E5779A}
.row{display:flex;gap:10px}
.muted{color:var(--soft)}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 6px 20px rgba(62,58,92,.07)}

/* ---- Login ---- */
.hello{text-align:center;margin:26px 0 22px}
.hello h1{font-size:30px}
.hello p{margin:6px 0 0;color:var(--soft)}
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.prof{position:relative;background:var(--card);border-radius:var(--r);padding:18px 10px 14px;text-align:center;box-shadow:0 6px 18px rgba(62,58,92,.07);transition:transform .15s}
.prof:active{transform:scale(.96)}
.prof .av{font-size:52px;line-height:1;display:block;margin-bottom:8px}
.prof .nm{font-weight:800;font-size:17px;word-break:break-word}
.prof .lk{font-size:12px;color:var(--soft)}
.prof.add{border:3px dashed #E2D6C3;background:transparent;box-shadow:none;color:var(--soft)}
.prof .del{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:var(--no);color:#fff;font-weight:800;display:none}
.managing .prof .del{display:block}
.mgr{display:block;margin:22px auto 0;color:var(--soft);font-weight:700;text-decoration:underline}

/* ---- Home ---- */
.who{display:flex;align-items:center;gap:10px}
.who .av{font-size:38px}
.who small{display:block;color:var(--soft);font-size:13px}
.who b{font-size:19px}
.years{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.years::-webkit-scrollbar{display:none}
.yr{flex:0 0 auto;padding:10px 16px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-weight:800;font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-size:17px}
.yr.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.subs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.sub{border-radius:var(--r);padding:18px 14px;text-align:left;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;transition:transform .15s}
.sub:active{transform:scale(.96)}
.sub .em{font-size:40px;line-height:1}
.sub h3{font-size:20px;margin-top:10px}
.sub small{font-weight:700;opacity:.75;font-size:13px}
.sub::after{content:"";position:absolute;right:-24px;bottom:-24px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.35)}
.sub.wide{grid-column:1/-1;min-height:100px;flex-direction:row;align-items:center;gap:14px;justify-content:flex-start}
.sub.wide h3{margin:0}
.sub.lock{filter:grayscale(.7);opacity:.6}
.s-bm{background:var(--bm)} .s-bi{background:var(--bi)} .s-math{background:var(--math)} .s-sains{background:var(--sains)} .s-sejarah{background:var(--sejarah)}
.section-t{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 10px}
.section-t h2{font-size:21px}
.hist{display:flex;flex-direction:column;gap:10px}
.hi{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px}
.hi .em{font-size:26px}
.hi .tx{flex:1;min-width:0}
.hi .tx b{display:block;font-size:15px}
.hi .tx small{color:var(--soft);font-size:13px}
.hi .sc{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:800;font-size:18px}

/* ---- Sheet ---- */
.overlay{position:fixed;inset:0;background:rgba(62,58,92,.35);display:none;align-items:flex-end;justify-content:center;z-index:20}
.overlay.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:up .28s ease;max-height:92vh;overflow:auto}
.overlay.center{align-items:center;padding:16px}
.overlay.center .sheet{border-radius:28px}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.sheet h2{font-size:24px;margin-bottom:4px}
.lbl{font-weight:800;margin:18px 0 8px;font-size:15px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:10px 14px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-weight:800}
.opt.on{border-color:var(--ink);background:var(--ink);color:#fff}
.inp{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);font:inherit;font-weight:700;background:var(--card);color:var(--ink)}
.inp:focus{outline:none;border-color:var(--accent)}
.avs{display:flex;flex-wrap:wrap;gap:8px}
.avs button{font-size:30px;width:52px;height:52px;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.avs button.on{border-color:var(--accent);background:#FFE9F0}
.pinshow{display:flex;justify-content:center;gap:12px;margin:18px 0}
.pinshow i{width:18px;height:18px;border-radius:50%;background:var(--line)}
.pinshow i.f{background:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{padding:16px;border-radius:16px;background:var(--card);font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:800;font-size:24px;box-shadow:0 3px 0 var(--line)}
.err{color:var(--no);font-weight:700;text-align:center;min-height:22px;margin-top:8px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ---- Quiz ---- */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qx{width:42px;height:42px;border-radius:14px;background:var(--card);font-size:20px;font-weight:800;border:2px solid var(--line)}
.prog{flex:1;height:14px;border-radius:999px;background:var(--card);overflow:hidden;border:2px solid var(--line)}
.prog i{display:block;height:100%;width:0;border-radius:999px;transition:width .3s}
.qn{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:800}
.timer{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:800}
.tbar{flex:1;height:10px;border-radius:999px;background:#F1E9DC;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--ok);border-radius:999px;transition:width 1s linear,background .3s}
.qcard{border-radius:26px;padding:24px 20px;margin-bottom:16px;min-height:150px;display:flex;flex-direction:column;justify-content:center}
.qcard .tag{font-weight:800;font-size:13px;opacity:.7;margin-bottom:8px}
.qcard h2{font-size:24px;white-space:pre-line;font-weight:700;word-break:break-word}
.answers{display:flex;flex-direction:column;gap:10px}
.ans{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;font-weight:700;font-size:18px;box-shadow:0 4px 0 var(--line);transition:transform .08s,background .2s,border-color .2s}
.ans:active{transform:translateY(2px)}
.ans .k{flex:0 0 36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:800;background:var(--bg)}
.ans.pick{border-color:var(--ink);background:#F4F1FF}
.ans.pick .k{background:var(--ink);color:#fff}

/* ---- Result ---- */
.res{text-align:center;padding-top:10px}
.stars{font-size:48px;letter-spacing:6px;margin:6px 0}
.stars .off{filter:grayscale(1);opacity:.25}
.big{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:800;font-size:64px;line-height:1}
.big small{font-size:28px;color:var(--soft)}
.msg{font-size:20px;font-weight:800;margin:6px 0 4px}
.meta{color:var(--soft);font-weight:700;margin-bottom:22px}
.stack{display:flex;flex-direction:column;gap:12px}
.rv{background:var(--card);border-radius:20px;padding:16px;border-left:8px solid var(--ok);margin-bottom:12px}
.rv.bad{border-left-color:var(--no)}
.rv .h{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:13px;color:var(--soft);margin-bottom:6px}
.rv h3{font-size:18px;font-family:Nunito,system-ui,sans-serif;font-weight:800;white-space:pre-line;margin-bottom:10px}
.pill{display:block;padding:8px 12px;border-radius:12px;font-weight:700;margin-top:6px;font-size:15px}
.pill.y{background:var(--ok-bg);color:#2E7D52}
.pill.n{background:var(--no-bg);color:#B54848}
.rv .ex{margin-top:8px;font-size:14px;color:var(--soft)}
.filter{display:flex;gap:8px;margin:4px 0 14px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.empty{text-align:center;color:var(--soft);padding:20px;background:var(--card);border-radius:16px}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap">

  <!-- LOGIN -->
  <section id="s-login" class="screen">
    <div class="hello">
      <div style="font-size:54px">🌈</div>
      <h1>Cerdik <span style="color:var(--accent)">Ceria</span></h1>
      <p>Siapa nak belajar hari ini?</p>
    </div>
    <div class="profiles" id="profiles"></div>
    <button class="mgr" id="btnManage">Urus profil</button>
  </section>

  <!-- HOME -->
  <section id="s-home" class="screen">
    <div class="top">
      <div class="who"><span class="av" id="hAv"></span><div><small>Hai,</small><b id="hName"></b></div></div>
      <button class="chip" id="btnLogout">🔄 Tukar</button>
    </div>
    <div class="years" id="years"></div>
    <div class="subs" id="subs"></div>
    <div class="section-t"><h2>Markah terkini</h2><small class="muted" id="histCount"></small></div>
    <div class="hist" id="hist"></div>
  </section>

  <!-- QUIZ -->
  <section id="s-quiz" class="screen">
    <div class="qtop">
      <button class="qx" id="btnQuit" aria-label="Keluar">✕</button>
      <div class="prog"><i id="progBar"></i></div>
      <span class="qn" id="qNum"></span>
    </div>
    <div class="timer" id="timerBox"><span>⏱️</span><div class="tbar"><i id="tBar"></i></div><span id="tLeft"></span></div>
    <div class="qcard" id="qCard"><div class="tag" id="qTag"></div><h2 id="qText"></h2></div>
    <div class="answers" id="answers"></div>
  </section>

  <!-- RESULT -->
  <section id="s-result" class="screen">
    <div class="res">
      <div style="font-size:60px" id="rEmoji"></div>
      <div class="stars" id="rStars"></div>
      <div class="big" id="rScore"></div>
      <div class="msg" id="rMsg"></div>
      <div class="meta" id="rMeta"></div>
    </div>
    <div class="stack">
      <button class="btn pink" id="btnReview">🔍 Semak jawapan</button>
      <button class="btn" id="btnRetry">🔁 Cuba lagi</button>
      <button class="btn ghost" id="btnHome">🏠 Menu utama</button>
    </div>
  </section>

  <!-- REVIEW -->
  <section id="s-review" class="screen">
    <div class="top">
      <button class="chip" id="btnBack">← Kembali</button>
      <b class="baloo" style="font-size:20px">Semakan jawapan</b>
    </div>
    <div class="filter">
      <button class="opt on" data-f="all">Semua</button>
      <button class="opt" data-f="bad">Salah sahaja</button>
    </div>
    <div id="reviewList"></div>
  </section>
</div>

<!-- Sheet: tetapan kuiz -->
<div class="overlay" id="ovSetup"><div class="sheet">
  <h2 id="suTitle"></h2><div class="muted" id="suSub"></div>
  <div class="lbl">Berapa soalan?</div>
  <div class="opts" id="optCount"></div>
  <div class="lbl">Ikut masa?</div>
  <div class="opts" id="optTime"></div>
  <div style="height:22px"></div>
  <button class="btn pink" id="btnStart">🚀 Mula!</button>
  <div style="height:10px"></div>
  <button class="btn ghost" data-close>Batal</button>
</div></div>

<!-- Sheet: profil baru -->
<div class="overlay" id="ovNew"><div class="sheet">
  <h2>Profil baru ✨</h2>
  <div class="lbl">Nama</div>
  <input class="inp" id="npName" maxlength="16" placeholder="cth: Aisyah" autocomplete="off">
  <div class="lbl">Pilih watak</div>
  <div class="avs" id="npAvs"></div>
  <div class="lbl">PIN 4 nombor <span class="muted">(pilihan — kosongkan jika tak perlu)</span></div>
  <input class="inp" id="npPin" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
  <div class="err" id="npErr"></div>
  <button class="btn pink" id="btnCreate">Simpan</button>
  <div style="height:10px"></div>
  <button class="btn ghost" data-close>Batal</button>
</div></div>

<!-- PIN pad -->
<div class="overlay center" id="ovPin"><div class="sheet" style="max-width:360px">
  <div style="text-align:center"><div style="font-size:50px" id="pinAv"></div><h2 id="pinTitle"></h2><div class="muted">Masukkan PIN</div></div>
  <div class="pinshow" id="pinShow"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad"></div>
  <div class="err" id="pinErr"></div>
  <button class="btn ghost" data-close>Batal</button>
</div></div>

<!-- Confirm -->
<div class="overlay center" id="ovConfirm"><div class="sheet" style="max-width:360px;text-align:center">
  <div style="font-size:46px" id="cfEm">🤔</div>
  <h2 id="cfTitle"></h2>
  <p class="muted" id="cfText"></p>
  <div class="row"><button class="btn ghost" data-close>Tidak</button><button class="btn pink" id="cfYes">Ya</button></div>
</div></div>

<script src="soalan.js"></script>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const KEY = "cerdikceria.v1";   // unik supaya tak bercampur dengan app lain di github.io yang sama
const AVATARS = ["🦊","🐼","🐯","🐰","🐸","🦄","🐨","🐧","🐱","🐶","🦁","🐵","🐙","🦋"];
const SUBJECTS = [
  {id:"bm", name:"Bahasa Melayu", em:"📖"},
  {id:"bi", name:"English", em:"🔤"},
  {id:"math", name:"Matematik", em:"🔢"},
  {id:"sains", name:"Sains", em:"🔬"},
  {id:"sejarah", name:"Sejarah", em:"🏰", from:4}
];
const SUB = Object.fromEntries(SUBJECTS.map(s => [s.id, s]));

/* ---------- storage ---------- */
let db = { profiles: [], current: null };
function load(){ try{ const v = JSON.parse(localStorage.getItem(KEY)); if(v && v.profiles) db = v; }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
const me = () => db.profiles.find(p => p.id === db.current);

/* ---------- navigation ---------- */
function show(id){ document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); window.scrollTo(0,0); }
function open(id){ $(id).classList.add("on"); }
function close(el){ (el.closest ? el.closest(".overlay") : el).classList.remove("on"); }
let cfCancel = null, paused = false;
document.querySelectorAll(".overlay").forEach(o => {
  o.addEventListener("click", e => {
    if(e.target === o || e.target.hasAttribute("data-close")){
      o.classList.remove("on");
      if(o.id === "ovConfirm" && cfCancel){ const f = cfCancel; cfCancel = null; f(); }
    }
  });
});
function confirmBox(em, title, text, yes, cancel){
  cfCancel = cancel || null;
  $("#cfEm").textContent = em; $("#cfTitle").textContent = title; $("#cfText").textContent = text;
  $("#cfYes").onclick = () => { cfCancel = null; close($("#ovConfirm")); yes(); };
  open("#ovConfirm");
}

/* ---------- LOGIN ---------- */
function renderLogin(){
  const box = $("#profiles"); box.innerHTML = "";
  db.profiles.forEach(p => {
    const b = document.createElement("button"); b.className = "prof";
    b.innerHTML = `<span class="av"></span><div class="nm"></div><div class="lk">${p.pin ? "🔒 ada PIN" : "&nbsp;"}</div><span class="del" role="button" aria-label="Padam">✕</span>`;
    b.querySelector(".av").textContent = p.avatar;
    b.querySelector(".nm").textContent = p.name;
    b.onclick = e => {
      if(e.target.classList.contains("del")){ askDelete(p); return; }
      if(p.pin) askPin(p, () => login(p)); else login(p);
    };
    box.appendChild(b);
  });
  const add = document.createElement("button"); add.className = "prof add";
  add.innerHTML = `<span class="av">➕</span><div class="nm">Tambah</div><div class="lk">profil baru</div>`;
  add.onclick = newProfile; box.appendChild(add);
  $("#btnManage").style.display = db.profiles.length ? "block" : "none";
}
$("#btnManage").onclick = () => {
  const on = $("#s-login").classList.toggle("managing");
  $("#btnManage").textContent = on ? "Siap" : "Urus profil";
};
function askDelete(p){
  const go = () => confirmBox("🗑️", `Padam ${p.name}?`, "Semua markah profil ini akan hilang.", () => {
    db.profiles = db.profiles.filter(x => x.id !== p.id); save(); renderLogin();
  });
  if(p.pin) askPin(p, go); else go();
}
let npAvatar = AVATARS[0];
function newProfile(){
  $("#npName").value = ""; $("#npPin").value = ""; $("#npErr").textContent = "";
  npAvatar = AVATARS[db.profiles.length % AVATARS.length];
  const avs = $("#npAvs"); avs.innerHTML = "";
  AVATARS.forEach(a => {
    const b = document.createElement("button"); b.textContent = a; if(a === npAvatar) b.className = "on";
    b.onclick = () => { npAvatar = a; avs.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); };
    avs.appendChild(b);
  });
  open("#ovNew"); setTimeout(() => $("#npName").focus(), 250);
}
$("#btnCreate").onclick = () => {
  const name = $("#npName").value.trim(), pin = $("#npPin").value.trim();
  if(!name){ $("#npErr").textContent = "Tulis nama dulu ya 🙂"; return; }
  if(pin && !/^\d{4}$/.test(pin)){ $("#npErr").textContent = "PIN mesti 4 nombor"; return; }
  const p = { id: Date.now().toString(36), name, avatar: npAvatar, pin: pin || "", year: 1, history: [] };
  db.profiles.push(p); save(); close($("#ovNew")); login(p);
};
let pinBuf = "", pinOk = null, pinProfile = null;
function askPin(p, ok){
  pinBuf = ""; pinOk = ok; pinProfile = p;
  $("#pinAv").textContent = p.avatar; $("#pinTitle").textContent = p.name; $("#pinErr").textContent = "";
  drawPin(); open("#ovPin");
}
function drawPin(){ $("#pinShow").querySelectorAll("i").forEach((d,i) => d.classList.toggle("f", i < pinBuf.length)); }
(function buildPad(){
  const pad = $("#pad");
  ["1","2","3","4","5","6","7","8","9","","0","⌫"].forEach(k => {
    const b = document.createElement("button"); b.textContent = k;
    if(!k){ b.style.visibility = "hidden"; }
    b.onclick = () => {
      if(k === "⌫"){ pinBuf = pinBuf.slice(0,-1); drawPin(); return; }
      if(pinBuf.length >= 4) return;
      pinBuf += k; drawPin();
      if(pinBuf.length === 4){
        if(pinBuf === pinProfile.pin){ close($("#ovPin")); setTimeout(pinOk, 120); }
        else { $("#pinErr").textContent = "PIN salah, cuba lagi"; $("#pinShow").classList.add("shake");
          setTimeout(() => { $("#pinShow").classList.remove("shake"); pinBuf = ""; drawPin(); }, 400); }
      }
    };
    pad.appendChild(b);
  });
})();
function login(p){ db.current = p.id; save(); $("#s-login").classList.remove("managing"); $("#btnManage").textContent = "Urus profil"; renderHome(); show("s-home"); }
$("#btnLogout").onclick = () => { db.current = null; save(); renderLogin(); show("s-login"); };

/* ---------- HOME ---------- */
function renderHome(){
  const p = me(); if(!p){ renderLogin(); show("s-login"); return; }
  $("#hAv").textContent = p.avatar; $("#hName").textContent = p.name;
  const yrs = $("#years"); yrs.innerHTML = "";
  for(let y = 1; y <= 6; y++){
    const b = document.createElement("button"); b.className = "yr" + (p.year === y ? " on" : ""); b.textContent = "Tahun " + y;
    b.onclick = () => { p.year = y; save(); renderHome(); };
    yrs.appendChild(b);
  }
  const subs = $("#subs"); subs.innerHTML = "";
  SUBJECTS.forEach((s, i) => {
    const locked = s.from && p.year < s.from;
    const b = document.createElement("button");
    b.className = `sub s-${s.id}` + (i === SUBJECTS.length - 1 ? " wide" : "") + (locked ? " lock" : "");
    const best = bestScore(p, s.id, p.year);
    b.innerHTML = `<span class="em">${locked ? "🔒" : s.em}</span><div><h3>${s.name}</h3><small>${locked ? "Bermula Tahun " + s.from : (best != null ? "Terbaik: " + best + "%" : "Jom mula!")}</small></div>`;
    b.onclick = () => { if(locked){ confirmBox("🏰", "Sejarah bermula Tahun 4", "Dalam KSSR, subjek Sejarah diajar mulai Tahun 4. Tukar ke Tahun 4?", () => { p.year = 4; save(); renderHome(); }); return; } openSetup(s.id); };
    subs.appendChild(b);
  });
  const h = $("#hist"); h.innerHTML = "";
  const list = p.history.slice(0, 8);
  $("#histCount").textContent = p.history.length ? p.history.length + " kuiz" : "";
  if(!list.length){ h.innerHTML = `<div class="empty">Belum ada kuiz lagi. Pilih subjek di atas untuk mula! 🎯</div>`; return; }
  list.forEach(r => {
    const d = document.createElement("div"); d.className = "hi";
    const pct = Math.round(r.score / r.total * 100);
    d.innerHTML = `<span class="em">${SUB[r.sub].em}</span><div class="tx"><b>${SUB[r.sub].name} · T${r.year}</b><small>${fmtDate(r.at)}${r.timed ? " · ⏱️ " + r.timed + "s" : ""}</small></div><span class="sc" style="color:${pct >= 80 ? "var(--ok)" : pct >= 50 ? "var(--math-d)" : "var(--no)"}">${r.score}/${r.total}</span>`;
    h.appendChild(d);
  });
}
function bestScore(p, sub, year){
  const rs = p.history.filter(r => r.sub === sub && r.year === year);
  if(!rs.length) return null;
  return Math.max(...rs.map(r => Math.round(r.score / r.total * 100)));
}
function fmtDate(t){ const d = new Date(t); return d.toLocaleDateString("ms-MY", {day:"numeric", month:"short"}) + ", " + d.toLocaleTimeString("ms-MY", {hour:"2-digit", minute:"2-digit"}); }

/* ---------- SETUP ---------- */
let setup = { sub: "bm", count: 10, time: 0 };
function chips(box, values, cur, label, onPick){
  box.innerHTML = "";
  values.forEach(v => {
    const b = document.createElement("button"); b.className = "opt" + (v === cur ? " on" : ""); b.textContent = label(v);
    b.onclick = () => { onPick(v); box.querySelectorAll(".opt").forEach(x => x.classList.toggle("on", x === b)); };
    box.appendChild(b);
  });
}
function openSetup(sub){
  const p = me(); setup.sub = sub;
  const avail = sub === "math" ? 99 : ((BANK[sub][p.year] || []).length);
  const counts = [5, 10, 15, 20].filter(n => n <= avail || n === 5);
  if(!counts.includes(setup.count)) setup.count = counts[counts.length - 1];
  $("#suTitle").textContent = `${SUB[sub].em} ${SUB[sub].name}`;
  $("#suSub").textContent = `Tahun ${p.year}`;
  chips($("#optCount"), counts, setup.count, v => v + " soalan", v => setup.count = v);
  chips($("#optTime"), [0, 20, 30, 60], setup.time, v => v ? `⏱️ ${v} saat / soalan` : "😌 Tanpa masa", v => setup.time = v);
  open("#ovSetup");
}
$("#btnStart").onclick = () => { close($("#ovSetup")); startQuiz(); };

/* ---------- QUIZ ---------- */
let quiz = null, tick = null;
const shuffle = a => { a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function buildQuestions(sub, year, n){
  const raw = sub === "math" ? MATH.generate(year, n) : shuffle(BANK[sub][year] || []).slice(0, n);
  return raw.map(r => {
    const [q, right, ...rest] = r;
    const wrongs = rest.slice(0, 3), exp = rest[3] || "";
    return { q, right, exp, options: shuffle([right, ...wrongs]), picked: null };
  });
}
function startQuiz(){
  const p = me();
  quiz = { sub: setup.sub, year: p.year, time: setup.time, i: 0, qs: buildQuestions(setup.sub, p.year, setup.count) };
  const col = getComputedStyle(document.documentElement);
  $("#progBar").style.background = col.getPropertyValue(`--${quiz.sub}-d`);
  $("#qCard").style.background = col.getPropertyValue(`--${quiz.sub}`);
  $("#timerBox").style.display = quiz.time ? "flex" : "none";
  show("s-quiz"); renderQ();
}
function renderQ(){
  const q = quiz.qs[quiz.i], n = quiz.qs.length;
  $("#qNum").textContent = `${quiz.i + 1}/${n}`;
  $("#progBar").style.width = (quiz.i / n * 100) + "%";
  $("#qTag").textContent = `${SUB[quiz.sub].name} · Tahun ${quiz.year}`;
  $("#qText").textContent = q.q;
  const box = $("#answers"); box.innerHTML = "";
  q.options.forEach((o, k) => {
    const b = document.createElement("button"); b.className = "ans";
    b.innerHTML = `<span class="k">${"ABCD"[k]}</span><span></span>`;
    b.lastChild.textContent = o;
    b.onclick = () => pick(o, b);
    box.appendChild(b);
  });
  if(quiz.time) startTimer();
}
let locked = false;
function pick(o, btn){
  if(locked) return; locked = true;
  stopTimer();
  quiz.qs[quiz.i].picked = o;
  if(btn) btn.classList.add("pick");
  setTimeout(() => { locked = false; next(); }, btn ? 380 : 600);
}
function next(){
  quiz.i++;
  if(quiz.i >= quiz.qs.length){ $("#progBar").style.width = "100%"; finish(); }
  else renderQ();
}
function startTimer(){
  stopTimer();
  let left = quiz.time;
  const bar = $("#tBar");
  bar.style.transition = "none"; bar.style.width = "100%"; bar.style.background = "var(--ok)";
  $("#tLeft").textContent = left + "s";
  requestAnimationFrame(() => { bar.style.transition = ""; });
  tick = setInterval(() => {
    if(paused) return;
    left--;
    $("#tLeft").textContent = Math.max(left, 0) + "s";
    bar.style.width = Math.max(left, 0) / quiz.time * 100 + "%";
    if(left <= quiz.time * 0.3) bar.style.background = "var(--no)";
    else if(left <= quiz.time * 0.6) bar.style.background = "var(--math-d)";
    if(left <= 0){ stopTimer(); quiz.qs[quiz.i].timeout = true; pick(null, null); }
  }, 1000);
}
function stopTimer(){ if(tick){ clearInterval(tick); tick = null; } }
$("#btnQuit").onclick = () => {
  paused = true;   // masa berhenti sementara
  confirmBox("🚪", "Berhenti kuiz?", "Markah kuiz ini tidak akan disimpan.",
    () => { paused = false; stopTimer(); quiz = null; renderHome(); show("s-home"); },
    () => { paused = false; });
};

/* ---------- RESULT ---------- */
function finish(){
  const p = me();
  const score = quiz.qs.filter(q => q.picked === q.right).length, total = quiz.qs.length;
  const pct = Math.round(score / total * 100);
  p.history.unshift({ sub: quiz.sub, year: quiz.year, score, total, timed: quiz.time, at: Date.now() });
  p.history = p.history.slice(0, 50); save();
  const stars = pct >= 80 ? 3 : pct >= 50 ? 2 : pct > 0 ? 1 : 0;
  $("#rStars").innerHTML = [1,2,3].map(i => `<span class="${i <= stars ? "" : "off"}">⭐</span>`).join("");
  $("#rScore").innerHTML = `${score}<small>/${total}</small>`;
  const msgs = pct === 100 ? ["🏆","Hebat! Semua betul!"] : pct >= 80 ? ["🎉","Syabas! Cemerlang!"] : pct >= 50 ? ["👍","Bagus! Teruskan usaha!"] : ["💪","Tak apa, cuba lagi ya!"];
  $("#rEmoji").textContent = msgs[0]; $("#rMsg").textContent = msgs[1];
  $("#rMeta").textContent = `${SUB[quiz.sub].name} · Tahun ${quiz.year} · ${pct}%`;
  show("s-result");
  if(pct >= 80) confetti();
}
$("#btnRetry").onclick = () => { setup.sub = quiz.sub; setup.count = quiz.qs.length; setup.time = quiz.time; startQuiz(); };
$("#btnHome").onclick = () => { renderHome(); show("s-home"); };
$("#btnReview").onclick = () => { renderReview("all"); show("s-review"); };
$("#btnBack").onclick = () => show("s-result");
document.querySelectorAll(".filter .opt").forEach(b => b.onclick = () => {
  document.querySelectorAll(".filter .opt").forEach(x => x.classList.toggle("on", x === b));
  renderReview(b.dataset.f);
});
function renderReview(f){
  const box = $("#reviewList"); box.innerHTML = "";
  const items = quiz.qs.map((q, i) => ({ q, i })).filter(({ q }) => f === "all" || q.picked !== q.right);
  if(!items.length){ box.innerHTML = `<div class="empty">Tiada jawapan salah. Syabas! 🌟</div>`; return; }
  items.forEach(({ q, i }) => {
    const ok = q.picked === q.right;
    const d = document.createElement("div"); d.className = "rv" + (ok ? "" : " bad");
    d.innerHTML = `<div class="h"><span>Soalan ${i + 1}</span><span>${ok ? "✅ Betul" : "❌ Salah"}</span></div><h3></h3>`;
    d.querySelector("h3").textContent = q.q;
    const add = (cls, label, val) => { const s = document.createElement("span"); s.className = "pill " + cls; s.textContent = label + val; d.appendChild(s); };
    if(ok) add("y", "Jawapan kamu: ", q.right);
    else {
      add("n", "Jawapan kamu: ", q.picked == null ? (q.timeout ? "— (masa tamat)" : "—") : q.picked);
      add("y", "Jawapan betul: ", q.right);
    }
    if(q.exp){ const e = document.createElement("div"); e.className = "ex"; e.textContent = "💡 " + q.exp; d.appendChild(e); }
    box.appendChild(d);
  });
}

/* ---------- confetti ---------- */
function confetti(){
  const c = $("#confetti"), x = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cols = ["#FFC8B4","#BFE3FF","#FFE79E","#C5EFCF","#E3D3FF","#FF9DBB"];
  const ps = Array.from({length: 120}, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, s: 6 + Math.random() * 8, vy: 2 + Math.random() * 3, vx: -1.5 + Math.random() * 3, r: Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)] }));
  let t = 0;
  (function f(){
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.y += p.vy; p.x += p.vx; p.r += .1; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); x.restore(); });
    if(++t < 200) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height);
  })();
}

/* ---------- start ---------- */
load();
if(me()){ renderHome(); show("s-home"); } else { db.current = null; renderLogin(); show("s-login"); }
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(() => {}); }
})();
</script>
